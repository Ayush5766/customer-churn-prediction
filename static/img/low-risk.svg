<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="low-grad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="low-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Background Ring -->
  <circle cx="60" cy="60" r="50" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2" filter="url(#low-glow)"/>
  <circle cx="60" cy="60" r="42" fill="#064e3b" fill-opacity="0.4"/>

  <!-- Customer Face Silhouette -->
  <!-- Head -->
  <circle cx="60" cy="46" r="16" fill="#a7f3d0"/>
  <!-- Happy Eyes (Arcs) -->
  <path d="M53 43 C54 41, 56 41, 57 43" stroke="#065f46" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M63 43 C64 41, 66 41, 67 43" stroke="#065f46" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M54 50 Q60 56, 66 50" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Shoulders -->
  <path d="M38 84 C38 70, 82 70, 82 84 Z" fill="#6ee7b7"/>

  <!-- Checkmark Badge in Bottom Right -->
  <circle cx="86" cy="86" r="16" fill="url(#low-grad)" stroke="#0f172a" stroke-width="3"/>
  <path d="M78 86 L83 91 L94 80" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
