<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="logo-shield-bg" x1="10" y1="6" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M24 4L9 10.5V23C9 32.5 15.4 41.2 24 44C32.6 41.2 39 32.5 39 23V10.5L24 4Z" 
        fill="url(#logo-shield-bg)" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Pulse / Retention Graph Line -->
  <path d="M15 26L20 22L24 27L29 18L33 22" 
        stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logo-glow)"/>

  <!-- Key data nodes -->
  <circle cx="20" cy="22" r="2" fill="#06b6d4"/>
  <circle cx="24" cy="27" r="2" fill="#8b5cf6"/>
  <circle cx="29" cy="18" r="2.5" fill="#38bdf8"/>
</svg>
