<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="med-grad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="med-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Background Ring -->
  <circle cx="60" cy="60" r="50" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2" filter="url(#med-glow)"/>
  <circle cx="60" cy="60" r="42" fill="#78350f" fill-opacity="0.4"/>

  <!-- Customer Face Silhouette -->
  <!-- Head -->
  <circle cx="60" cy="46" r="16" fill="#fde68a"/>
  <!-- Neutral Eyes -->
  <circle cx="55" cy="43" r="2" fill="#78350f"/>
  <circle cx="65" cy="43" r="2" fill="#78350f"/>
  <!-- Neutral straight mouth -->
  <line x1="55" y1="52" x2="65" y2="52" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M38 84 C38 70, 82 70, 82 84 Z" fill="#fcd34d"/>

  <!-- Warning Badge in Bottom Right -->
  <circle cx="86" cy="86" r="16" fill="url(#med-grad)" stroke="#0f172a" stroke-width="3"/>
  <path d="M86 78 V86" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="86" cy="92" r="1.8" fill="#ffffff"/>
</svg>
