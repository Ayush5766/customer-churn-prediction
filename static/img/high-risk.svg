<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="high-grad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="high-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Background Ring -->
  <circle cx="60" cy="60" r="50" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="2" filter="url(#high-glow)"/>
  <circle cx="60" cy="60" r="42" fill="#7f1d1d" fill-opacity="0.4"/>

  <!-- Customer Face Silhouette -->
  <!-- Head -->
  <circle cx="60" cy="46" r="16" fill="#fecaca"/>
  <!-- Worried Eyebrows angled up -->
  <path d="M52 38 L57 41" stroke="#991b1b" stroke-width="2" stroke-linecap="round"/>
  <path d="M68 38 L63 41" stroke="#991b1b" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="55" cy="44" r="2.2" fill="#991b1b"/>
  <circle cx="65" cy="44" r="2.2" fill="#991b1b"/>
  <!-- Downward / frowning mouth -->
  <path d="M54 53 Q60 48, 66 53" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Shoulders -->
  <path d="M38 84 C38 70, 82 70, 82 84 Z" fill="#fca5a5"/>

  <!-- Alert Badge with Downward Arrow in Bottom Right -->
  <circle cx="86" cy="86" r="16" fill="url(#high-grad)" stroke="#0f172a" stroke-width="3"/>
  <!-- Downward Arrow -->
  <path d="M86 78 V92 M81 87 L86 92 L91 87" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
